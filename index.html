<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');
:root{
  --green:#2d5a1b;--green-light:#3d7a25;--green-bright:#5aab35;--green-glow:#7ed44f;
  --amber:#c47f17;--amber-light:#f5a623;--red:#c0392b;--red-light:#e74c3c;
  --bg:#0a120a;--bg3:#152015;--surface:#1e2e1e;--surface2:#243424;
  --border:rgba(90,171,53,0.15);--border2:rgba(90,171,53,0.25);
  --text:#e8f5e0;--text2:#a8c89a;--text3:#6a8f60;
  --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh;overscroll-behavior:none;}
body{padding-bottom:env(safe-area-inset-bottom,20px);}
.app{max-width:480px;margin:0 auto;padding:0 16px 32px;}

/* Header */
.header{padding:20px 0 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.app-title{font-size:26px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-0.5px;}
.app-title span{color:var(--green-glow);}
.app-meta{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px;}
.loc-ok{color:var(--green-glow);} .loc-est{color:var(--amber-light);}
.refresh-btn{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:8px 12px;color:var(--text2);font-family:var(--mono);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.refresh-btn:active{transform:scale(0.95);}
.spin{animation:spin 0.8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Filters — top */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fpill{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:6px 13px;font-family:var(--mono);font-size:11px;color:var(--text3);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.15s;}
.fpill.on{background:var(--bg3);border-color:var(--green-bright);color:var(--green-glow);}
.fpill.fav-pill.on{border-color:var(--amber-light);color:var(--amber-light);}

/* Stat grid */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.stat.clickable{cursor:pointer;transition:border-color 0.15s;}
.stat.clickable:active{border-color:var(--green-bright);}
.stat-label{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;}
.stat-value{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--text);line-height:1;}
.stat-value.warn{color:var(--amber-light);} .stat-value.danger{color:var(--red-light);}
.stat-sub{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:3px;}
.stat-hint{font-family:var(--mono);font-size:10px;color:var(--green-bright);margin-top:4px;}

/* Daylight bar */
.daybar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
.daybar-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:8px;}
.daybar-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.daybar-fill{height:100%;border-radius:4px;transition:width 0.6s ease,background 0.6s ease;}

/* Open-all popover */
.openall-pop{display:none;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px;margin-top:8px;}
.openall-pop.open{display:block;}
.openall-pop p{font-family:var(--mono);font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.5;}
.openall-btn{width:100%;background:var(--green);border:1px solid var(--green-light);border-radius:9px;padding:12px;color:var(--green-glow);font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.openall-btn:active{transform:scale(0.98);background:var(--green-light);}
.openall-btn.disabled{background:var(--surface);border-color:var(--border);color:var(--text3);cursor:not-allowed;}

/* Section head */
.section-head{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.sdot-g{background:var(--green-bright);} .sdot-r{background:var(--red-light);}

/* Course card */
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;}
.ccard.dimmed{opacity:0.3;}
.ccard-left{flex:1;min-width:0;}
.ccard-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.ccard-meta{font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:4px;}
.ccard-region{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}
.ccard-times{font-family:var(--mono);font-size:11px;margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap;}
.t-leave{color:var(--amber-light);} .t-arrive{color:var(--green-bright);}
.badges{display:flex;gap:4px;flex-wrap:wrap;}
.badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;font-weight:500;}
.b18{background:rgba(90,171,53,0.15);color:var(--green-glow);border:1px solid rgba(90,171,53,0.25);}
.b9{background:rgba(196,127,23,0.15);color:var(--amber-light);border:1px solid rgba(196,127,23,0.25);}
.btype{background:rgba(255,255,255,0.05);color:var(--text3);border:1px solid var(--border);}
.bno{background:rgba(192,57,43,0.12);color:var(--red-light);border:1px solid rgba(192,57,43,0.2);}
.bgn{background:rgba(55,138,221,0.12);color:#7ab8f5;border:1px solid rgba(55,138,221,0.2);}

/* Card right actions */
.ccard-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.book-btn{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:7px 10px;color:var(--text2);font-family:var(--mono);font-size:11px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.book-btn:active{background:var(--surface2);transform:scale(0.95);}
.fav-btn{background:none;border:none;font-size:18px;cursor:pointer;padding:2px;line-height:1;opacity:0.5;transition:opacity 0.15s,transform 0.15s;}
.fav-btn.on{opacity:1;}
.fav-btn:active{transform:scale(1.3);}

.no-results{text-align:center;padding:32px 20px;font-family:var(--mono);font-size:13px;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:14px;}
.pulse{animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>

<div class="app">

  <div class="header">

</div>

  {name:"City Golf Club Toowoomba",suburb:"Toowoomba",drive:92,holes:[18],type:"public",golfnow:false,region:"toowoomba",url:"https://citygolf.com.au/golf/"},
];

// ── Constants ────────────────────────────────────────────────
const PREP = 20;   // mins prep before leaving house
const BUFFER = 15; // mins buffer before tee time
const REGION_LABELS = {brisbane:'Brisbane',goldcoast:'Gold Coast',sunshine:'Sunshine Coast',toowoomba:'Toowoomba / Scenic Rim'};

// ── State ────────────────────────────────────────────────────
let sunsetMins = null;
let activeFilter = localStorage.getItem('gf_filter') || 'all';
let favourites = JSON.parse(localStorage.getItem('gf_favs') || '[]');
let popOpen = false;

// ── Time helpers ─────────────────────────────────────────────
function pad(n){ return String(n).padStart(2,'0'); }
function nowMins(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function minsToStr(m){
  const h=Math.floor(((m%1440)+1440)%1440/60), mn=((m%60)+60)%60;
  return `${h%12||12}:${pad(mn)}${h>=12?'pm':'am'}`;
}

// ── Playability — drive + prep already accounted for caller side ──
// Can play 9 if: daylight >= drive + 150 (round) + BUFFER
// Leave by = now + PREP; Arrival = now + PREP + drive
function canPlay9(drive, daylight){ return daylight >= drive + 150 + BUFFER; }
function canPlay18(drive, daylight){ return daylight >= drive + 270 + BUFFER; }

// ── Location + sunset ────────────────────────────────────────
function getLocation(){
  return new Promise(resolve => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat:p.coords.latitude, lng:p.coords.longitude}),
      () => resolve(null),
      {timeout:8000, maximumAge:300000}
    );
  });
}

async function fetchSunset(lat, lng){
  const la = lat||-27.4698, lo = lng||153.0251;
  try {
    const r = await fetch(`https://api.sunrisesunset.io/json?lat=${la}&lng=${lo}&timezone=auto&date=today`);
    const d = await r.json();
    if(d.status==='OK'){
      const [time,ap] = d.results.sunset.split(' ');
      const [hh,mm] = time.split(':').map(Number);
      let h = hh;
      if(ap==='PM'&&hh!==12) h+=12;
      if(ap==='AM'&&hh===12) h=0;
      return {mins:h*60+mm, live:true};
    }
  } catch(e) {}
  const mo = new Date().getMonth();
  return {mins:(mo>=4&&mo<=8)?17*60+10:18*60+25, live:false};
}

// ── Filter logic ─────────────────────────────────────────────
function setFilter(f, btn){
  activeFilter = f;
  localStorage.setItem('gf_filter', f);
  document.querySelectorAll('.fpill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  popOpen = false;
  document.getElementById('openall-pop').classList.remove('open');
  render();
}

function getFiltered(daylight){
  return COURSES.filter(c => {
    const p9  = canPlay9(c.drive, daylight)  && c.holes.includes(9);
    const p18 = canPlay18(c.drive, daylight) && c.holes.includes(18);
    switch(activeFilter){
      case 'favs':     return favourites.includes(c.name);
      case 'playable': return p9 || p18;
      case '18':       return p18;
      // FIX: 9-hole filter shows all courses where 9 is playable (even if 18 also available)
      case '9':        return p9;
      case 'close':    return c.drive <= 30;
      // visitor-friendly = public + semi-private (not members-only private)
      case 'visitor':  return c.type !== 'private';
      case 'golfnow':  return c.golfnow;
      case 'brisbane': return c.region === 'brisbane';
      case 'goldcoast':return c.region === 'goldcoast';
      case 'sunshine': return c.region === 'sunshine';
      case 'toowoomba':return c.region === 'toowoomba';
      default:         return true;
    }
  });
}

// ── Toggle open-all popover ──────────────────────────────────
function toggleOpenAll(){
  popOpen = !popOpen;
  document.getElementById('openall-pop').classList.toggle('open', popOpen);
}

function openAll(){
  const daylight = Math.max(0, sunsetMins - nowMins());
  const toOpen = getFiltered(daylight).filter(c => canPlay9(c.drive,daylight) || canPlay18(c.drive,daylight));
  if(!toOpen.length) return;
  toOpen.forEach((c,i) => { setTimeout(()=>{ window.open(c.url,'_blank'); }, i*200); });
}

// ── Favourites ───────────────────────────────────────────────
function toggleFav(name, btn){
  const idx = favourites.indexOf(name);
  if(idx === -1){ favourites.push(name); btn.classList.add('on'); btn.textContent='⭐'; }
  else { favourites.splice(idx,1); btn.classList.remove('on'); btn.textContent='☆'; }
  localStorage.setItem('gf_favs', JSON.stringify(favourites));
  if(activeFilter==='favs') render();
}

// ── Render ───────────────────────────────────────────────────
function render(){
  if(sunsetMins === null) return;
  const now = nowMins();
  const daylight = Math.max(0, sunsetMins - now);

  // Stats
  document.getElementById('s-now').textContent = minsToStr(now);
  document.getElementById('s-sunset').textContent = minsToStr(sunsetMins);
  const dlEl = document.getElementById('s-daylight');
  dlEl.textContent = (daylight/60).toFixed(1)+' hrs';
  dlEl.className = 'stat-value' + (daylight<120?' danger':daylight<240?' warn':'');

  // Daylight bar
  const sunriseMins = 5*60+30, totalDay = sunsetMins-sunriseMins;
  const pct = Math.min(100,Math.max(0,Math.round(((now-sunriseMins)/totalDay)*100)));
  const fill = document.getElementById('daybar-fill');
  fill.style.width = pct+'%';
  fill.style.background = pct>85?'var(--red-light)':pct>65?'var(--amber-light)':'var(--green-bright)';

  // Viable counts — all courses regardless of filter
  // 9-avail = any course where 9 is playable; 18-avail = any where 18 is playable
  const all18 = COURSES.filter(c=>canPlay18(c.drive,daylight)&&c.holes.includes(18)).length;
  const all9  = COURSES.filter(c=>canPlay9(c.drive,daylight)&&c.holes.includes(9)).length;
  const totalViable = COURSES.filter(c=>canPlay9(c.drive,daylight)||canPlay18(c.drive,daylight)).length;
  document.getElementById('s-viable').textContent = totalViable;
  document.getElementById('s-viable-sub').textContent = `${all18} for 18 · ${all9} for 9`;

  // Open-all popover content — respects current filter
  const filtered = getFiltered(daylight);
  const openable = filtered.filter(c=>canPlay9(c.drive,daylight)||canPlay18(c.drive,daylight));
  const hint = document.getElementById('s-viable-hint');
  const pop = document.getElementById('openall-pop');
  const popDesc = document.getElementById('openall-desc');
  const popBtn = document.getElementById('openall-btn');
  if(openable.length>0){
    hint.textContent = 'tap to open booking pages ↓';
    popDesc.textContent = `${openable.length} course${openable.length!==1?'s':''} match your current filter with enough daylight. Opens each booking page in a new tab.`;
    popBtn.classList.remove('disabled');
  } else {
    hint.textContent = totalViable>0?'change filter to open bookings':'no playable courses today';
    popDesc.textContent = 'No courses in current filter have enough daylight remaining.';
    popBtn.classList.add('disabled');
  }

  // Restore active filter pill
  document.querySelectorAll('.fpill').forEach(btn=>{
    const f = btn.getAttribute('onclick').match(/setFilter\('(.*?)'/)?.[1];
    btn.classList.toggle('on', f===activeFilter);
  });

  // Course list — use filtered for non-'all', full sorted list for 'all'
  const display = activeFilter==='all'
    ? [...COURSES].sort((a,b)=>a.drive-b.drive)
    : filtered;

  const playable    = display.filter(c=>canPlay9(c.drive,daylight)||canPlay18(c.drive,daylight));
  const notPlayable = activeFilter==='all'
    ? display.filter(c=>!canPlay9(c.drive,daylight)&&!canPlay18(c.drive,daylight))
    : [];

  let html = '';
  if(playable.length){
    html += `<div class="section-head"><span class="sdot sdot-g"></span>Playable today &mdash; ${playable.length} course${playable.length!==1?'s':''}</div>`;
    playable.forEach(c => { html += courseCard(c, daylight, false); });
  }
  if(notPlayable.length){
    html += `<div class="section-head" style="margin-top:20px;"><span class="sdot sdot-r"></span>Not enough daylight &mdash; ${notPlayable.length} course${notPlayable.length!==1?'s':''}</div>`;
    notPlayable.forEach(c => { html += courseCard(c, daylight, true); });
  }
  if(!playable.length && !notPlayable.length){
    html = '<div class="no-results">No courses match this filter.</div>';
  }
  document.getElementById('course-list').innerHTML = html;
}

function courseCard(c, daylight, dimmed){
  const p9  = canPlay9(c.drive, daylight)  && c.holes.includes(9);
  const p18 = canPlay18(c.drive, daylight) && c.holes.includes(18);
  const isFav = favourites.includes(c.name);

  // FIX: Leave by = now + PREP (20 min to get ready and out)
  //      Arrival  = now + PREP + drive
  const leaveBy  = nowMins() + PREP;
  const arriveAt = nowMins() + PREP + c.drive;
  const timeLine = !dimmed
    ? `<div class="ccard-times"><span class="t-leave">leave ${minsToStr(leaveBy)}</span><span class="t-arrive">arrive ~${minsToStr(arriveAt)}</span></div>`
    : '';

  const typeBadge = `<span class="badge btype">${c.type}</span>`;
  const gnBadge   = c.golfnow ? `<span class="badge bgn">GolfNow</span>` : '';
  const regionLabel = REGION_LABELS[c.region]||c.region;

  return `<div class="ccard${dimmed?' dimmed':''}">
    <div class="ccard-left">
      <div class="ccard-name">${c.name}</div>
      <div class="ccard-meta">${c.suburb} &middot; ${c.drive} min drive</div>
      <div class="ccard-region">${regionLabel}</div>
      ${timeLine}
      <div class="badges">
        ${p18?'<span class="badge b18">18 holes</span>':''}
        ${p9 ?'<span class="badge b9">9 holes</span>':''}
        ${dimmed?'<span class="badge bno">no time today</span>':''}
        ${typeBadge}${gnBadge}
      </div>
    </div>
    <div class="ccard-right">
      <a class="book-btn" href="${c.url}" target="_blank">Visit &#8599;</a>
      <button class="fav-btn${isFav?' on':''}" onclick="toggleFav('${c.name}',this)">${isFav?'⭐':'☆'}</button>
    </div>
  </div>`;
}

// ── Init ─────────────────────────────────────────────────────
async function init(){
  const icon = document.getElementById('refresh-icon');
  icon.className = 'spin';
  document.querySelectorAll('.stat-value').forEach(el=>el.classList.add('pulse'));
  document.getElementById('loc-status').textContent = 'getting location...';
  document.getElementById('loc-status').className = 'app-meta loc-est';

  const loc = await getLocation();
  const lat = loc?.lat, lng = loc?.lng;
  if(loc){
    document.getElementById('loc-status').textContent = `GPS ${lat.toFixed(3)}, ${lng.toFixed(3)}`;
    document.getElementById('loc-status').className = 'app-meta loc-ok';
  } else {
    document.getElementById('loc-status').textContent = 'location unavailable — using Toowong default';
    document.getElementById('loc-status').className = 'app-meta loc-est';
  }

  const result = await fetchSunset(lat, lng);
  sunsetMins = result.mins;
  document.getElementById('s-sunset-src').textContent = result.live ? 'live sunset' : 'est. sunset';
  document.getElementById('updated-ts').textContent = 'updated ' + new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('.stat-value').forEach(el=>el.classList.remove('pulse'));
  icon.className = '';
  render();
  clearInterval(window._iv);
  window._iv = setInterval(()=>{
    render();
    document.getElementById('updated-ts').textContent = 'updated '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
  }, 60000);
}

init();
</script>

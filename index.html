<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');
:root{
  --green:#2d5a1b;--gl:#3d7a25;--gb:#5aab35;--gg:#7ed44f;
  --amber:#c47f17;--al:#f5a623;--red:#c0392b;--rl:#e74c3c;
  --bg:#0a120a;--bg3:#152015;--sur:#1e2e1e;--sur2:#243424;
  --bdr:rgba(90,171,53,0.15);--bdr2:rgba(90,171,53,0.25);
  --tx:#e8f5e0;--tx2:#a8c89a;--tx3:#6a9d60;
  --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--tx);font-family:var(--sans);min-height:100dvh;overscroll-behavior:none;}
body{padding-bottom:env(safe-area-inset-bottom,20px);}
.app{max-width:480px;margin:0 auto;padding:0 16px 32px;}

/* ── Header ── */
.header{padding:18px 0 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.app-title{font-size:26px;font-weight:800;color:var(--tx);line-height:1;letter-spacing:-0.5px;}
.app-title span{color:var(--gg);}
.app-meta{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:4px;}
.loc-ok{color:var(--gg);} .loc-est{color:var(--al);}
.hdr-btn{background:var(--sur);border:1px solid var(--bdr2);border-radius:10px;width:42px;height:38px;color:var(--tx2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s;}
.hdr-btn:active{transform:scale(0.95);background:var(--sur2);}
.spin{animation:spin 0.8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── DAYLIGHT BAR — hero redesign ── */
.daybar{background:var(--sur);border:1px solid var(--bdr2);border-radius:16px;padding:16px 18px 14px;margin-bottom:14px;}
.daybar-icons{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;position:relative;}
.daybar-icon-col{display:flex;flex-direction:column;align-items:center;gap:3px;}
.daybar-icon-col.mid{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;transform:translateX(-50%);transition:left 0.8s ease;}
.daybar-icon-emoji{font-size:22px;line-height:1;}
.daybar-icon-time{font-family:var(--mono);font-size:12px;color:var(--tx2);line-height:1;}
.daybar-icon-label{font-family:var(--mono);font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:0.06em;}
.daybar-track{height:12px;background:var(--bg3);border-radius:6px;overflow:hidden;position:relative;margin-bottom:12px;}
.daybar-fill{height:100%;border-radius:6px;transition:width 0.8s ease,background 0.8s ease;}
.daybar-bottom{display:flex;justify-content:space-between;align-items:baseline;}
.daybar-remain-label{font-family:var(--mono);font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:0.08em;}
.daybar-remain{font-family:var(--mono);font-size:21px;font-weight:500;color:var(--tx);line-height:1;}
.daybar-remain.warn{color:var(--al);}.daybar-remain.danger{color:var(--rl);}
.daybar-remain-unit{font-family:var(--mono);font-size:12px;color:var(--tx3);margin-left:3px;}

/* ── Stat row — fancy pass ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat{background:var(--sur);border:1px solid var(--bdr);border-radius:14px;padding:12px 12px 10px;position:relative;overflow:hidden;text-align:center;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(90,171,53,0.3),transparent);opacity:0;}
.stat.live::before{opacity:1;}
.stat-label{font-family:var(--mono);font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;}
.stat-value{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--tx);line-height:1;}
.stat-sub{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:3px;line-height:1.3;}
.viable-open{font-family:var(--mono);font-size:10px;color:var(--gb);margin-top:4px;}
/* Playable now — pulsing availability dot */
.avail-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:2px;flex-shrink:0;}
.avail-dot.on{background:var(--gb);animation:dotpulse 2s ease-in-out infinite;}
.avail-dot.off{background:var(--tx3);}
@keyframes dotpulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}
.stat-playable-row{display:flex;align-items:center;justify-content:center;margin-bottom:5px;}
/* Leave by — tap to open as pill button */
.stat-leaveby{cursor:default;}
.nearest-link{display:block;margin-top:7px;font-family:var(--mono);font-size:10px;color:var(--bg);background:var(--gb);text-decoration:none;border-radius:6px;padding:4px 8px;text-align:center;font-weight:600;letter-spacing:0.03em;transition:opacity 0.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nearest-link:active{opacity:0.75;}
/* Weather stat card */
.stat-wx-nearest{border-color:var(--bdr2);text-align:center;}
.stat-wx-nearest.warn{border-color:rgba(196,127,23,0.4);background:rgba(196,127,23,0.05);}
.stat-wx-nearest.bad{border-color:rgba(192,57,43,0.4);background:rgba(192,57,43,0.05);}
.stat-wx-icon{font-size:24px;line-height:1;margin:2px 0 3px;}
.stat-wx-temp{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--tx);line-height:1;margin-bottom:2px;}
.stat-wx-nearest.warn .stat-wx-temp{color:var(--al);}
.stat-wx-nearest.bad .stat-wx-temp{color:#f07060;}
.stat-wx-detail{font-family:var(--mono);font-size:10px;color:var(--tx3);line-height:1.5;}
.stat-wx-detail.wind{color:var(--tx2);font-weight:500;}
.stat-wx-nearest.warn .stat-wx-detail.wind{color:var(--al);}
.stat-wx-nearest.bad .stat-wx-detail.wind{color:#f07060;}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fpill{background:var(--sur);border:1px solid var(--bdr);border-radius:99px;padding:6px 13px;font-family:var(--mono);font-size:11px;color:var(--tx3);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.15s;}
.fpill.on{background:var(--bg3);border-color:var(--gb);color:var(--gg);}
.fpill.fav-pill.on{border-color:var(--al);color:var(--al);}

/* ── Nearest card with direct link ── */
.stat-leaveby{cursor:default;}
.stat-wx-nearest{background:var(--sur);border:1px solid var(--bdr2);}
.nearest-link{display:inline-block;margin-top:5px;font-family:var(--mono);font-size:11px;color:var(--gb);text-decoration:none;border-bottom:1px solid rgba(90,171,53,0.3);}
.nearest-link:active{opacity:0.7;}
.stat-wx-icon{font-size:22px;line-height:1;margin:4px 0 2px;}
.stat-wx-temp{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--tx);line-height:1;margin-bottom:2px;}
.stat-wx-detail{font-family:var(--mono);font-size:10px;color:var(--tx3);line-height:1.5;}
.stat-wx-nearest.warn .stat-wx-temp,.stat-wx-nearest.warn .stat-wx-detail{color:var(--al);}
.stat-wx-nearest.bad .stat-wx-temp,.stat-wx-nearest.bad .stat-wx-detail{color:#f07060;}
/* Course card weather — right column, split lines, more prominent */
.ccard-wx{margin-top:6px;text-align:right;}
.ccard-wx .wx-icon{font-size:18px;display:block;margin-bottom:2px;}
.ccard-wx .wx-temp{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--tx);display:block;line-height:1.2;}
.ccard-wx .wx-wind{font-family:var(--mono);font-size:11px;color:var(--tx3);display:block;line-height:1.4;}
.ccard-wx .wx-cond{font-family:var(--mono);font-size:11px;display:block;line-height:1.4;}
.ccard-wx.wx-warn .wx-temp,.ccard-wx.wx-warn .wx-cond{color:var(--al);}
.ccard-wx.wx-bad .wx-temp,.ccard-wx.wx-bad .wx-cond{color:var(--rl);}
.section-head{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--tx3);margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.sdot-g{background:var(--gb);} .sdot-r{background:var(--rl);}

/* ── Course card ── */
.ccard{background:var(--sur);border:1px solid var(--bdr);border-radius:14px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;}
.ccard.dimmed{opacity:0.28;}
.ccard-left{flex:1;min-width:0;}
.ccard-name{font-size:14px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.ccard-meta{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-bottom:3px;}
.ccard-region{font-family:var(--mono);font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px;}
.ccard-times{font-family:var(--mono);font-size:11px;margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap;}
.t-leave{color:var(--al);} .t-arrive{color:var(--gb);}
.badges{display:flex;gap:4px;flex-wrap:wrap;}
.badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;font-weight:500;}
.b18{background:rgba(90,171,53,0.15);color:var(--gg);border:1px solid rgba(90,171,53,0.25);}
.b9{background:rgba(196,127,23,0.15);color:var(--al);border:1px solid rgba(196,127,23,0.25);}
.bpar3{background:rgba(126,212,79,0.1);color:#a8e06b;border:1px solid rgba(126,212,79,0.2);}
.btype{background:rgba(255,255,255,0.05);color:#6aac60;border:1px solid var(--bdr);}
.bno{background:rgba(192,57,43,0.12);color:#f26b5e;border:1px solid rgba(192,57,43,0.2);}
.bgn{background:rgba(55,138,221,0.12);color:#7ab8f5;border:1px solid rgba(55,138,221,0.2);}
.bnobk{background:rgba(90,171,53,0.08);color:var(--tx2);border:1px solid rgba(90,171,53,0.15);}
.bfee{background:rgba(90,171,53,0.12);color:var(--gg);border:1px solid rgba(90,171,53,0.3);font-weight:600;}
.bfee-na{background:rgba(255,255,255,0.04);color:var(--tx3);border:1px solid var(--bdr);}
.ccard-rating{font-family:var(--mono);font-size:11px;color:var(--al);letter-spacing:0.02em;}
.ccard-wx{font-family:var(--mono);font-size:10px;color:var(--tx2);margin-top:4px;text-align:right;line-height:1.5;}
.ccard-wx.wx-warn{color:var(--al);}
.ccard-wx.wx-bad{color:var(--rl);}
.ccard-note{font-family:var(--mono);font-size:10px;color:var(--tx3);line-height:1.5;margin-bottom:4px;}
.ccard-name-row{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
.ccard-name-row .ccard-name{margin-bottom:0;}
.ccard-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;min-width:0;}
.visit-btn{background:var(--bg3);border:1px solid var(--bdr);border-radius:9px;padding:7px 8px;color:var(--tx2);font-family:var(--mono);font-size:10px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:3px;white-space:nowrap;}
.visit-btn:active{background:var(--sur2);transform:scale(0.95);}
.fav-btn{background:none;border:none;font-size:18px;cursor:pointer;padding:2px;line-height:1;opacity:0.45;transition:opacity 0.15s,transform 0.15s;}
.fav-btn.on{opacity:1;}
.fav-btn:active{transform:scale(1.3);}
.no-results{text-align:center;padding:32px 20px;font-family:var(--mono);font-size:13px;color:var(--tx3);background:var(--sur);border:1px solid var(--bdr);border-radius:14px;}
.pulse{animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* ── Closed today badge ── */
.bclosed{background:rgba(192,57,43,0.12);color:#f07060;border:1px solid rgba(192,57,43,0.25);}
.ccard.closed-today{border-color:rgba(192,57,43,0.2);}
.ccard.closed-today .ccard-name{opacity:0.6;}

/* ── Share button on card ── */
.share-btn{background:none;border:none;font-size:15px;cursor:pointer;padding:2px;line-height:1;color:rgba(122,184,245,0.8);transition:opacity 0.15s,transform 0.15s;}
.share-btn:active{transform:scale(1.2);opacity:1;}

/* ── Hole-in-one panel ── */
.hio-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;backdrop-filter:blur(2px);}
.hio-sheet{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--sur);border-top:1px solid var(--bdr2);border-radius:20px 20px 0 0;z-index:101;padding:20px 20px env(safe-area-inset-bottom,16px);max-height:85dvh;overflow-y:auto;}
.hio-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.hio-title{font-size:17px;font-weight:700;color:var(--tx);}
.hio-sub{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-top:2px;}
.hio-close{background:var(--sur2);border:none;border-radius:50%;width:28px;height:28px;color:var(--tx2);cursor:pointer;font-size:14px;margin-left:auto;display:flex;align-items:center;justify-content:center;}
.hio-form{background:var(--bg3);border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;}
.hio-form-label{font-family:var(--mono);font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;}
.hio-input{background:var(--sur);border:1px solid var(--bdr2);border-radius:8px;padding:10px 12px;color:var(--tx);font-family:var(--mono);font-size:13px;width:100%;outline:none;}
.hio-input:focus{border-color:var(--gb);}
.hio-input::placeholder{color:var(--tx3);}
.hio-submit{background:var(--green);border:1px solid var(--gl);border-radius:9px;padding:12px;color:var(--gg);font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;width:100%;}
.hio-submit:active{transform:scale(0.98);background:var(--gl);}
.hio-celebration{text-align:center;padding:16px;animation:celebfade 0.4s ease;}
@keyframes celebfade{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.hio-cel-emoji{font-size:40px;margin-bottom:8px;}
.hio-cel-text{font-size:18px;font-weight:700;color:var(--gg);margin-bottom:4px;}
.hio-cel-sub{font-family:var(--mono);font-size:12px;color:var(--tx2);}
.hio-entry{background:var(--bg3);border:1px solid var(--bdr);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;}
.hio-entry-icon{font-size:20px;flex-shrink:0;margin-top:1px;}
.hio-entry-course{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:2px;}
.hio-entry-detail{font-family:var(--mono);font-size:11px;color:var(--tx3);}
.hio-entry-del{background:none;border:none;color:var(--tx3);font-size:13px;cursor:pointer;margin-left:auto;padding:2px 6px;flex-shrink:0;}
.hio-entry-del:active{color:var(--rl);}
.hio-empty{font-family:var(--mono);font-size:12px;color:var(--tx3);text-align:center;padding:20px;}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div>
      <div class="app-title">SEQ <span>Golf</span> Finder</div>
      <div class="app-meta" id="updated-ts">tap refresh to load</div>
      <div class="app-meta" id="loc-status"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-start;">
      <button class="hdr-btn" onclick="showHio()" aria-label="Hole in one tracker">🏆</button>
      <button class="hdr-btn" onclick="init()" aria-label="Refresh course availability"><span id="refresh-icon" aria-hidden="true" style="font-size:18px;">↻</span></button>
    </div>
  </div>

  <!-- Hole-in-one panel -->
  <div id="hio-panel" style="display:none;">
    <div class="hio-overlay" onclick="hideHio()"></div>
    <div class="hio-sheet">
      <div class="hio-header">
        <span style="font-size:22px;" aria-hidden="true">🏆</span>
        <div>
          <div class="hio-title">Hole-in-One Tracker</div>
          <div class="hio-sub" id="hio-count-label">Your aces</div>
        </div>
        <button class="hio-close" onclick="hideHio()" aria-label="Close">✕</button>
      </div>
      <div class="hio-form">
        <div class="hio-form-label">Record a new ace</div>
        <input class="hio-input" id="hio-course" type="text" placeholder="Course name" aria-label="Course name">
        <div style="display:flex;gap:8px;">
          <input class="hio-input" id="hio-hole" type="number" placeholder="Hole #" min="1" max="18" aria-label="Hole number" style="width:90px;flex-shrink:0;">
          <input class="hio-input" id="hio-club" type="text" placeholder="Club used (optional)" aria-label="Club used" style="flex:1;">
        </div>
        <button class="hio-submit" onclick="recordHio()" aria-label="Record hole in one">⛳ Record Ace</button>
      </div>
      <div id="hio-celebration" style="display:none;" class="hio-celebration">
        <div class="hio-cel-emoji" aria-hidden="true">🎉</div>
        <div class="hio-cel-text">Ace recorded!</div>
        <div class="hio-cel-sub" id="hio-cel-detail"></div>
      </div>
      <div id="hio-list"></div>
    </div>
  </div>

  <!-- HERO: Daylight bar -->
  <div class="daybar">
    <div class="daybar-icons" id="daybar-icons-row" style="min-height:52px;">
      <div class="daybar-icon-col">
        <div class="daybar-icon-emoji" id="db-sunrise-icon" aria-hidden="true">🌅</div>
        <div class="daybar-icon-time" id="db-sunrise">--:--</div>
        <div class="daybar-icon-label">Sunrise</div>
      </div>
      <!-- Now icon — absolutely positioned, slides with bar -->
      <div class="daybar-icon-col mid" id="db-now-col" style="left:50%;">
        <div class="daybar-icon-emoji" id="db-now-icon" aria-hidden="true">☀️</div>
        <div class="daybar-icon-time" id="db-now">--:--</div>
        <div class="daybar-icon-label">Now</div>
      </div>
      <div class="daybar-icon-col" style="align-items:flex-end;">
        <div class="daybar-icon-emoji" aria-hidden="true">🌇</div>
        <div class="daybar-icon-time" id="db-sunset">--:--</div>
        <div class="daybar-icon-label">Last light</div>
      </div>
    </div>
    <div class="daybar-track"><div class="daybar-fill" id="daybar-fill" style="width:50%;background:var(--gb);"></div></div>
    <div class="daybar-bottom">
      <div class="daybar-remain-label">Daylight remaining</div>
      <div class="daybar-remain pulse" id="db-remain">--<span class="daybar-remain-unit">hrs</span></div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters" role="group" aria-label="Filter courses">
    <button class="fpill fav-pill" onclick="setFilter('favs',this)" aria-label="Show favourites">⭐ Favs</button>
    <button class="fpill on" onclick="setFilter('all',this)" aria-pressed="true">All</button>
    <button class="fpill" onclick="setFilter('playable',this)" aria-pressed="false">Playable</button>
    <button class="fpill" onclick="setFilter('18',this)" aria-pressed="false">18 holes</button>
    <button class="fpill" onclick="setFilter('9',this)" aria-pressed="false">9 holes</button>
    <button class="fpill" onclick="setFilter('par3',this)" aria-pressed="false">Par 3</button>
    <button class="fpill" onclick="setFilter('close',this)" aria-pressed="false">≤30 min</button>
    <button class="fpill" onclick="setFilter('visitor',this)" aria-pressed="false">Visitor-friendly</button>
    <button class="fpill" onclick="setFilter('golfnow',this)" aria-pressed="false">GolfNow</button>
    <button class="fpill" onclick="setFilter('nobooking',this)" aria-pressed="false">No booking</button>
    <button class="fpill" onclick="setFilter('brisbane',this)" aria-pressed="false">Brisbane</button>
    <button class="fpill" onclick="setFilter('goldcoast',this)" aria-pressed="false">Gold Coast</button>
    <button class="fpill" onclick="setFilter('sunshine',this)" aria-pressed="false">Sunshine Coast</button>
    <button class="fpill" onclick="setFilter('toowoomba',this)" aria-pressed="false">Toowoomba</button>
  </div>

  <!-- Stats row -->
  <div class="stats" role="region" aria-label="Current conditions">
    <div class="stat" id="stat-playable-card">
      <div class="stat-label">Playable now</div>
      <div class="stat-playable-row">
        <span class="avail-dot off" id="avail-dot"></span>
        <div class="stat-value pulse" id="s-playable">--</div>
      </div>
      <div class="stat-sub" id="s-playable-sub">in filter</div>
    </div>
    <div class="stat stat-leaveby" id="stat-leaveby-card">
      <div class="stat-label">Leave by</div>
      <div class="stat-value pulse" id="s-leaveby">--:--</div>
      <div class="stat-sub" id="s-leaveby-sub">for nearest</div>
      <a class="nearest-link" id="nearest-link" href="#" target="_blank" aria-label="Open nearest course website">⛳ tap to open</a>
    </div>
    <div class="stat stat-wx-nearest" id="stat-wx-card">
      <div class="stat-label" id="wx-card-label">Nearest weather</div>
      <div class="stat-wx-icon" id="wx-card-icon">--</div>
      <div class="stat-wx-temp" id="wx-card-temp">--°</div>
      <div class="stat-wx-detail" id="wx-card-wind">-- km/h</div>
      <div class="stat-wx-detail" id="wx-card-label2">--</div>
    </div>
  </div>

  <div id="course-list" role="list" aria-live="polite" aria-label="Golf courses"></div>
</div>

// ── Constants ────────────────────────────────────────────────
const PREP   = 20;   // mins to get ready and leave house
const BUFFER = 15;   // mins buffer before tee time
const SUNRISE_DEFAULT = 5*60+30;
const REGION_LABELS = {brisbane:'Brisbane',goldcoast:'Gold Coast',sunshine:'Sunshine Coast',toowoomba:'Toowoomba / Scenic Rim'};

// ── Weather zone coordinates ──────────────────────────────────
const ZONE_COORDS = {
  brisbane_metro: {lat:-27.4698, lng:153.0251},
  ipswich:        {lat:-27.6145, lng:152.7595},
  bayside:        {lat:-27.5743, lng:153.2189},
  gc_north:       {lat:-27.8333, lng:153.3333},
  gc_south:       {lat:-28.0500, lng:153.4000},
  sunshine:       {lat:-26.6500, lng:153.0700},
  toowoomba:      {lat:-27.5598, lng:151.9507},
};

// Find nearest zone to a GPS coordinate
function getNearestZone(lat,lng){
  let best='brisbane_metro', bestDist=Infinity;
  for(const [zone,coords] of Object.entries(ZONE_COORDS)){
    const d=Math.sqrt(Math.pow(lat-coords.lat,2)+Math.pow(lng-coords.lng,2));
    if(d<bestDist){bestDist=d;best=zone;}
  }
  return best;
}

// ── State ────────────────────────────────────────────────────
let sunsetMins   = null;
let sunriseMins  = SUNRISE_DEFAULT;
let activeFilter = localStorage.getItem('gf_filter') || 'all';
let favourites   = JSON.parse(localStorage.getItem('gf_favs') || '[]');
let weatherCache = {};  // zone -> {temp, wind, code, label}
let drawerOpen=false; // unused, kept for safety

// ── Weather helpers ───────────────────────────────────────────
// Open-Meteo WMO weather codes -> emoji + short label
function wxDesc(code){
  if(code===0)                       return {icon:'☀️', label:'Clear'};
  if(code<=2)                        return {icon:'⛅', label:'Partly cloudy'};
  if(code===3)                       return {icon:'☁️', label:'Overcast'};
  if(code>=45&&code<=48)             return {icon:'🌫', label:'Foggy'};
  if(code>=51&&code<=57)             return {icon:'🌦', label:'Drizzle'};
  if(code>=61&&code<=67)             return {icon:'🌧', label:'Rain'};
  if(code>=71&&code<=77)             return {icon:'❄️', label:'Snow'};
  if(code>=80&&code<=82)             return {icon:'🌦', label:'Showers'};
  if(code===95)                      return {icon:'⛈', label:'Thunderstorm'};
  if(code>=96&&code<=99)             return {icon:'⛈', label:'Storm+hail'};
  return {icon:'🌡', label:'Unknown'};
}

async function fetchWeatherZone(zone){
  if(weatherCache[zone]) return weatherCache[zone];
  const {lat,lng} = ZONE_COORDS[zone];
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m,weather_code&timezone=auto&forecast_days=1`;
    const r = await fetch(url);
    const d = await r.json();
    const c = d.current;
    const desc = wxDesc(c.weather_code);
    const result = {
      temp: Math.round(c.temperature_2m),
      wind: Math.round(c.wind_speed_10m),
      icon: desc.icon,
      label: desc.label,
      ok: true
    };
    weatherCache[zone] = result;
    return result;
  } catch(e) {
    return {temp:null,wind:null,icon:'',label:'',ok:false};
  }
}

async function fetchAllWeather(){
  const zones = Object.keys(ZONE_COORDS);
  await Promise.all(zones.map(z => fetchWeatherZone(z)));
}

// ── Time helpers ─────────────────────────────────────────────
function pad(n){ return String(n).padStart(2,'0'); }
function nowMins(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function minsToStr(m){
  const norm=((m%1440)+1440)%1440;
  const h=Math.floor(norm/60), mn=norm%60;
  return `${h%12||12}:${pad(mn)}${h>=12?'pm':'am'}`;
}

// ── Playability ───────────────────────────────────────────────
// Par-3: 9 holes ~60 min; Full: 9 holes ~150 min, 18 holes ~270 min
function roundMins(c, holeCount){
  if(c.par3) return 60;
  return holeCount === 18 ? 270 : 150;
}
function canPlayHoles(c, holeCount, daylight){
  if(!c.holes.includes(holeCount)) return false;
  return daylight >= c.drive + roundMins(c, holeCount) + BUFFER;
}
function canPlayAny(c, daylight){
  return c.holes.some(h => canPlayHoles(c, h, daylight));
}

// ── Location + sunset ────────────────────────────────────────
function getLocation(){
  return new Promise(resolve => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat:p.coords.latitude,lng:p.coords.longitude}),
      () => resolve(null),
      {timeout:8000,maximumAge:300000}
    );
  });
}

async function fetchSunset(lat,lng){
  const la=lat||-27.4698, lo=lng||153.0251;
  try{
    const r=await fetch(`https://api.sunrisesunset.io/json?lat=${la}&lng=${lo}&timezone=auto&date=today`);
    const d=await r.json();
    if(d.status==='OK'){
      const parse=str=>{
        const[time,ap]=str.split(' ');
        const[hh,mm]=time.split(':').map(Number);
        let h=hh;
        if(ap==='PM'&&hh!==12)h+=12;
        if(ap==='AM'&&hh===12)h=0;
        return h*60+mm;
      };
      return{sunset:parse(d.results.sunset),sunrise:parse(d.results.sunrise),live:true};
    }
  }catch(e){}
  const mo=new Date().getMonth();
  return{sunset:(mo>=4&&mo<=8)?17*60+10:18*60+25,sunrise:5*60+30,live:false};
}

// ── Filter ───────────────────────────────────────────────────
function setFilter(f,btn){
  activeFilter=f;
  localStorage.setItem('gf_filter',f);
  document.querySelectorAll('.fpill').forEach(b=>{
    b.classList.remove('on');
    b.setAttribute('aria-pressed','false');
  });
  btn.classList.add('on');
  btn.setAttribute('aria-pressed','true');
  render();
}

function getFiltered(daylight){
  return COURSES.filter(c=>{
    switch(activeFilter){
      case 'favs':      return favourites.includes(c.name);
      case 'playable':  return canPlayAny(c,daylight);
      case '18':        return canPlayHoles(c,18,daylight);
      case '9':         return canPlayHoles(c,9,daylight)||canPlayHoles(c,18,daylight);
      case 'par3':      return c.par3;
      case 'close':     return c.drive<=30;
      case 'visitor':   return c.type!=='private';
      case 'golfnow':   return c.golfnow;
      case 'nobooking': return c.noBooking;
      case 'brisbane':  return c.region==='brisbane';
      case 'goldcoast': return c.region==='goldcoast';
      case 'sunshine':  return c.region==='sunshine';
      case 'toowoomba': return c.region==='toowoomba';
      default:          return true;
    }
  });
}

// ── Favourites ───────────────────────────────────────────────
function toggleFav(name,btn){
  const idx=favourites.indexOf(name);
  if(idx===-1){favourites.push(name);btn.classList.add('on');btn.textContent='⭐';}
  else{favourites.splice(idx,1);btn.classList.remove('on');btn.textContent='☆';}
  localStorage.setItem('gf_favs',JSON.stringify(favourites));
  if(activeFilter==='favs')render();
}

// ── Render ───────────────────────────────────────────────────
function render(){
  if(sunsetMins===null)return;
  const now=nowMins();
  const daylight=Math.max(0,sunsetMins-now);
  const dHrs=(daylight/60).toFixed(1);

  // Hero daylight bar — remaining hours
  const remEl=document.getElementById('db-remain');
  remEl.innerHTML=`${dHrs}<span class="daybar-remain-unit">hrs</span>`;
  remEl.className='daybar-remain'+(daylight<120?' danger':daylight<240?' warn':'');

  document.getElementById('db-now').textContent=minsToStr(now);
  document.getElementById('db-sunset').textContent=minsToStr(sunsetMins);
  document.getElementById('db-sunrise').textContent=minsToStr(sunriseMins);

  const totalDay=sunsetMins-sunriseMins;
  const pct=Math.min(100,Math.max(0,Math.round(((now-sunriseMins)/totalDay)*100)));
  const fill=document.getElementById('daybar-fill');
  fill.style.width=pct+'%';
  fill.style.background=pct>85?'var(--rl)':pct>65?'var(--al)':'var(--gb)';

  // Sliding Now icon — position absolutely over icon row, clamped 6%–94%
  const nowCol=document.getElementById('db-now-col');
  if(now<=sunriseMins||now>=sunsetMins){
    nowCol.style.display='none'; // hide before sunrise and after sunset
  } else {
    nowCol.style.display='flex';
    const clampedPct=Math.min(94,Math.max(6,pct));
    nowCol.style.left=clampedPct+'%';
  }

  // Now icon — time of day base, override with nearest GPS zone weather
  // Use the zone closest to user's GPS, or brisbane_metro as fallback
  const gpsZone=window._gpsZone||'brisbane_metro';
  const gpsWx=weatherCache[gpsZone]||weatherCache['brisbane_metro'];
  let nowIcon='☀️';
  if(pct<8)       nowIcon='🌅';
  else if(pct<35) nowIcon='🌤';
  else if(pct<65) nowIcon='☀️';
  else if(pct<85) nowIcon='🌆';
  else            nowIcon='🌇';
  if(gpsWx&&gpsWx.ok){
    const lbl=gpsWx.label;
    if(lbl.includes('Storm')||lbl.includes('hail')) nowIcon='⛈';
    else if(lbl.includes('Rain'))    nowIcon='🌧';
    else if(lbl.includes('Shower'))  nowIcon='🌦';
    else if(lbl.includes('Drizzle')) nowIcon='🌦';
    else if(lbl.includes('Overcast'))nowIcon='☁️';
    else if(lbl.includes('cloudy'))  nowIcon='⛅';
    else if(lbl.includes('Foggy'))   nowIcon='🌫';
  }
  document.getElementById('db-now-icon').textContent=nowIcon;

  // Stats — all respond to active filter
  const filtered=getFiltered(daylight);
  const playableInFilter=filtered.filter(c=>canPlayAny(c,daylight));
  const playableInFilterCount=playableInFilter.length;

  // Pulsing availability dot
  const dot=document.getElementById('avail-dot');
  const playableCard=document.getElementById('stat-playable-card');
  if(playableInFilterCount>0){
    dot.className='avail-dot on';
    playableCard.classList.add('live');
  } else {
    dot.className='avail-dot off';
    playableCard.classList.remove('live');
  }
  // Playable now — show count large, sub label contextual
  document.getElementById('s-playable').textContent=playableInFilterCount;
  const filterLabels={'all':'of '+COURSES.length+' total','playable':'playable','18':'for 18 holes','9':'for 9+ holes','par3':'par 3 courses','close':'within 30 min','visitor':'visitor-friendly','golfnow':'on GolfNow','nobooking':'walk-up','brisbane':'Brisbane','goldcoast':'Gold Coast','sunshine':'Sunshine Coast','toowoomba':'Toowoomba'};
  document.getElementById('s-playable-sub').textContent=filterLabels[activeFilter]||'in filter';

  // Nearest viable course in current filter
  const nearest=playableInFilter.slice().sort((a,b)=>a.drive-b.drive)[0]||null;
  const leaveBy=nearest?minsToStr(now+PREP):null;

  document.getElementById('s-leaveby').textContent=leaveBy||'--:--';
  document.getElementById('s-leaveby-sub').textContent=nearest?`for ${nearest.suburb}`:'no viable course';

  // Leave by — nearest link, fixed height pill, never wraps
  const nearestLink=document.getElementById('nearest-link');
  if(nearest){
    nearestLink.href=nearest.url;
    nearestLink.textContent='⛳ '+nearest.name.split(' ').slice(0,2).join(' ');
    nearestLink.style.display='block';
  } else {
    nearestLink.style.display='none';
  }

  // Weather stat card — shows weather for nearest course's zone
  const wxCard=document.getElementById('stat-wx-card');
  const wxIcon=document.getElementById('wx-card-icon');
  const wxTemp=document.getElementById('wx-card-temp');
  const wxWind=document.getElementById('wx-card-wind');
  const wxLbl2=document.getElementById('wx-card-label2');
  const wxLbl =document.getElementById('wx-card-label');
  if(nearest){
    const wx=weatherCache[nearest.zone];
    wxLbl.textContent=nearest.suburb+' weather';
    if(wx&&wx.ok){
      const isBad =wx.label.includes('Storm')||wx.label.includes('hail');
      const isWarn=wx.label.includes('Rain')||wx.label.includes('Drizzle')||wx.label.includes('Shower');
      wxCard.className='stat stat-wx-nearest'+(isBad?' bad':isWarn?' warn':'');
      wxIcon.textContent=wx.icon;
      wxTemp.textContent=wx.temp+'°';
      wxWind.className='stat-wx-detail wind';
      wxWind.textContent=wx.wind+' km/h';
      wxLbl2.className='stat-wx-detail';
      wxLbl2.textContent=wx.label;
    } else {
      wxCard.className='stat stat-wx-nearest';
      wxIcon.textContent='🌡';
      wxTemp.textContent='--°';
      wxWind.textContent='loading...';
      wxLbl2.textContent='';
    }
  } else {
    wxLbl.textContent='Nearest weather';
    wxIcon.textContent='--';
    wxTemp.textContent='';
    wxWind.textContent='no course';
    wxLbl2.textContent='in filter';
  }

  // Open-all button
  const openable=playableInFilter;

  // Restore active pill
  document.querySelectorAll('.fpill').forEach(b=>{
    const f=b.getAttribute('onclick').match(/setFilter\('([^']+)'/)?.[1];
    if(f)b.classList.toggle('on',f===activeFilter);
  });

  // Course list — always show unavailable courses dimmed, regardless of filter
  const display=activeFilter==='all'
    ?[...COURSES].sort((a,b)=>a.drive-b.drive)
    :filtered;
  const allInFilter=activeFilter==='all'?[...COURSES].sort((a,b)=>a.drive-b.drive):filtered;
  const playable=allInFilter.filter(c=>canPlayAny(c,daylight));
  const notPlayable=allInFilter.filter(c=>!canPlayAny(c,daylight));

  let html='';
  if(playable.length){
    html+=`<div class="section-head"><span class="sdot sdot-g"></span>Playable today &mdash; ${playable.length} course${playable.length!==1?'s':''}</div>`;
    playable.forEach(c=>{html+=courseCard(c,daylight,false);});
  }
  if(notPlayable.length){
    html+=`<div class="section-head" style="margin-top:20px;"><span class="sdot sdot-r"></span>Not enough daylight &mdash; ${notPlayable.length} course${notPlayable.length!==1?'s':''}</div>`;
    notPlayable.forEach(c=>{html+=courseCard(c,daylight,true);});
  }
  if(!playable.length&&!notPlayable.length)html='<div class="no-results">No courses match this filter.</div>';
  document.getElementById('course-list').innerHTML=html;
}

function courseCard(c,daylight,dimmed){
  const can9 =canPlayHoles(c,9,daylight);
  const can18=canPlayHoles(c,18,daylight);
  const isFav=favourites.includes(c.name);

  // Closed today
  const todayDay=new Date().getDay();
  const isClosed=c.closedDays&&c.closedDays.includes(todayDay);

  const leaveBy =nowMins()+PREP;
  const arriveAt=nowMins()+PREP+c.drive;
  const timeLine=!dimmed
    ?`<div class="ccard-times"><span class="t-leave">leave ${minsToStr(leaveBy)}</span><span class="t-arrive">arrive ~${minsToStr(arriveAt)}</span></div>`
    :'';

  const roundTime=c.par3?'~1 hr/9':can18?'~4.5 hrs/18':'~2.5 hrs/9';
  const ratingStr=c.rating?`★ ${c.rating.toFixed(1)}`:'';

  const wx=weatherCache[c.zone];
  let wxHtml='';
  if(wx&&wx.ok){
    const isWarn=wx.label.includes('Rain')||wx.label.includes('Drizzle')||wx.label.includes('Shower');
    const isBad=wx.label.includes('Storm')||wx.label.includes('hail');
    const wxClass=isBad?'ccard-wx wx-bad':isWarn?'ccard-wx wx-warn':'ccard-wx';
    wxHtml=`<div class="${wxClass}"><span class="wx-icon">${wx.icon}</span><span class="wx-temp">${wx.temp}°</span><span class="wx-wind">${wx.wind} km/h</span><span class="wx-cond">${wx.label}</span></div>`;
  }

  const noteHtml=c.note?`<div class="ccard-note">${c.note}</div>`:'';
  const visitorNoteHtml=c.visitorNote?`<div class="ccard-note" style="color:var(--al);">⚠ ${c.visitorNote}</div>`:'';

  let bFee='';
  if(c.type!=='private'){
    const showNine=c.par3||(can9&&!can18);
    const feeVal=showNine?(c.fee9||c.fee18):c.fee18;
    if(feeVal) bFee=`<span class="badge bfee">Est. $${feeVal}/${showNine?'9':'18'}</span>`;
  }

  const b18=can18?'<span class="badge b18">18 holes</span>':'';
  const b9=can9&&!can18?'<span class="badge b9">9 holes</span>':'';  // only show if 18 not available
  const bP3=c.par3?'<span class="badge bpar3">par 3</span>':'';
  const bType=`<span class="badge btype">${c.type}</span>`;
  const bGN=c.golfnow?'<span class="badge bgn">GolfNow</span>':'';
  const bNB=c.noBooking?'<span class="badge bnobk">walk-up</span>':'';
  const bNo=dimmed?'<span class="badge bno">no time today</span>':'';
  const bClosed=isClosed?'<span class="badge bclosed">closed today</span>':'';

  const safeName=c.name.replace(/'/g,"\\'");
  const safeSuburb=c.suburb.replace(/'/g,"\\'");
  return `<div class="ccard${dimmed?' dimmed':''}${isClosed?' closed-today':''}">
    <div class="ccard-left">
      <div class="ccard-name-row">
        <div class="ccard-name">${c.name}</div>
        ${ratingStr?`<span class="ccard-rating">${ratingStr}</span>`:''}
      </div>
      <div class="ccard-meta">${c.suburb} &middot; ${c.drive} min drive &middot; ${roundTime}</div>
      <div class="ccard-region">${REGION_LABELS[c.region]||c.region}</div>
      ${noteHtml}${visitorNoteHtml}
      ${timeLine}
      <div class="badges">${b18}${b9}${bP3}${bFee}${bNo}${bClosed}${bType}${bGN}${bNB}</div>
    </div>
    <div class="ccard-right">
      <a class="visit-btn" href="${c.url}" target="_blank" aria-label="Open ${c.name} website">⛳ tap to open</a>
      <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:4px;">
        <button class="share-btn" onclick="shareCourse('${safeName}','${safeSuburb}',${c.drive})" aria-label="Share ${safeName}">↗️</button>
        <button class="fav-btn${isFav?' on':''}" onclick="toggleFav('${safeName}',this)" aria-label="${isFav?'Remove':'Add'} ${safeName} ${isFav?'from':'to'} favourites" aria-pressed="${isFav}">${isFav?'⭐':'☆'}</button>
      </div>
      ${wxHtml}
    </div>
  </div>`;
}

// ── Hole-in-one tracker ──────────────────────────────────────
let hios = JSON.parse(localStorage.getItem('gf_hios')||'[]');

function showHio(){
  document.getElementById('hio-panel').style.display='block';
  document.body.style.overflow='hidden';
  renderHioList();
}
function hideHio(){
  document.getElementById('hio-panel').style.display='none';
  document.body.style.overflow='';
  document.getElementById('hio-celebration').style.display='none';
}
function recordHio(){
  const course=document.getElementById('hio-course').value.trim();
  const hole=document.getElementById('hio-hole').value.trim();
  const club=document.getElementById('hio-club').value.trim();
  if(!course){document.getElementById('hio-course').focus();return;}
  const entry={
    id:Date.now(),
    course,
    hole:hole?parseInt(hole):null,
    club:club||null,
    date:new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})
  };
  hios.unshift(entry);
  localStorage.setItem('gf_hios',JSON.stringify(hios));
  // Clear form
  document.getElementById('hio-course').value='';
  document.getElementById('hio-hole').value='';
  document.getElementById('hio-club').value='';
  // Show celebration
  const cel=document.getElementById('hio-celebration');
  const detail=`${entry.course}${entry.hole?', hole '+entry.hole:''}${entry.club?' · '+entry.club:''}`;
  document.getElementById('hio-cel-detail').textContent=detail;
  cel.style.display='block';
  setTimeout(()=>{cel.style.display='none';},3000);
  renderHioList();
}
function deleteHio(id){
  hios=hios.filter(h=>h.id!==id);
  localStorage.setItem('gf_hios',JSON.stringify(hios));
  renderHioList();
}
function renderHioList(){
  const count=hios.length;
  document.getElementById('hio-count-label').textContent=
    count===0?'No aces yet — go get one':count===1?'1 ace on record':`${count} aces on record`;
  const list=document.getElementById('hio-list');
  if(!count){list.innerHTML='<div class="hio-empty">Your hole-in-ones will appear here</div>';return;}
  list.innerHTML=hios.map(h=>`
    <div class="hio-entry">
      <div class="hio-entry-icon" aria-hidden="true">⛳</div>
      <div style="flex:1;min-width:0;">
        <div class="hio-entry-course">${h.course}</div>
        <div class="hio-entry-detail">
          ${h.hole?`Hole ${h.hole} · `:''}${h.date}${h.club?` · ${h.club}`:''}
        </div>
      </div>
      <button class="hio-entry-del" onclick="deleteHio(${h.id})" aria-label="Delete this ace">✕</button>
    </div>
  `).join('');
}

// ── Share a course ───────────────────────────────────────────
function shareCourse(name, suburb, drive){
  const leaveStr=minsToStr(nowMins()+PREP);
  const arriveStr=minsToStr(nowMins()+PREP+drive);
  const text=`🏌️ Heading to ${name} (${suburb}) — leaving ${leaveStr}, arrive ~${arriveStr}. You in?`;
  if(navigator.share){
    navigator.share({text}).catch(()=>{});
  } else {
    navigator.clipboard?.writeText(text).then(()=>alert('Copied to clipboard!')).catch(()=>alert(text));
  }
}

// ── Init ─────────────────────────────────────────────────────
// Apply saved filter pill immediately on load (before async init)
(function applyInitialFilter(){
  document.querySelectorAll('.fpill').forEach(b=>{
    const f=b.getAttribute('onclick').match(/setFilter\('([^']+)'/)?.[1];
    if(f){
      b.classList.toggle('on',f===activeFilter);
      b.setAttribute('aria-pressed',f===activeFilter?'true':'false');
    }
  });
})();
async function init(){
  const icon=document.getElementById('refresh-icon');
  icon.className='spin';
  document.querySelectorAll('.stat-value,.daybar-remain').forEach(el=>el.classList.add('pulse'));
  document.getElementById('loc-status').textContent='getting location...';
  document.getElementById('loc-status').className='app-meta loc-est';

  const loc=await getLocation();
  const lat=loc?.lat,lng=loc?.lng;
  if(loc){
    document.getElementById('loc-status').textContent=`GPS ${lat.toFixed(3)}, ${lng.toFixed(3)}`;
    document.getElementById('loc-status').className='app-meta loc-ok';
    // Detect nearest weather zone to GPS position
    window._gpsZone=getNearestZone(lat,lng);
  }else{
    document.getElementById('loc-status').textContent='location unavailable — using Toowong';
    document.getElementById('loc-status').className='app-meta loc-est';
    window._gpsZone='brisbane_metro';
  }

  const [result] = await Promise.all([
    fetchSunset(lat, lng),
    fetchAllWeather()
  ]);
  sunsetMins=result.sunset;
  sunriseMins=result.sunrise||SUNRISE_DEFAULT;
  document.getElementById('loc-status').textContent += result.live?' · sunset live':' · sunset est.';
  document.getElementById('updated-ts').textContent='updated '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('.stat-value,.daybar-remain').forEach(el=>el.classList.remove('pulse'));
  icon.className='';
  render();
  clearInterval(window._iv);
  window._iv=setInterval(()=>{
    render();
    document.getElementById('updated-ts').textContent='updated '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
  },60000);
}

init();
</script>

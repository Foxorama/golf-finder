<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');
:root{
  --green:#2d5a1b;--gl:#3d7a25;--gb:#5aab35;--gg:#7ed44f;
  --amber:#c47f17;--al:#f5a623;--red:#c0392b;--rl:#e74c3c;
  --bg:#0a120a;--bg3:#152015;--sur:#1e2e1e;--sur2:#243424;
  --bdr:rgba(90,171,53,0.15);--bdr2:rgba(90,171,53,0.25);
  --tx:#e8f5e0;--tx2:#a8c89a;--tx3:#6a8f60;
  --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--tx);font-family:var(--sans);min-height:100dvh;overscroll-behavior:none;}
body{padding-bottom:env(safe-area-inset-bottom,20px);}
.app{max-width:480px;margin:0 auto;padding:0 16px 32px;}

/* ── Header ── */
.header{padding:18px 0 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.app-title{font-size:26px;font-weight:800;color:var(--tx);line-height:1;letter-spacing:-0.5px;}
.app-title span{color:var(--gg);}
.app-meta{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:4px;}
.loc-ok{color:var(--gg);} .loc-est{color:var(--al);}
.refresh-btn{background:var(--sur);border:1px solid var(--bdr2);border-radius:10px;padding:8px 12px;color:var(--tx2);font-family:var(--mono);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.refresh-btn:active{transform:scale(0.95);}
.spin{animation:spin 0.8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── DAYLIGHT BAR — hero ── */
.daybar{background:var(--sur);border:1px solid var(--bdr2);border-radius:16px;padding:18px 18px 14px;margin-bottom:14px;}
.daybar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.daybar-title{font-family:var(--mono);font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:0.1em;}
.daybar-remain{font-family:var(--mono);font-size:28px;font-weight:500;color:var(--tx);line-height:1;}
.daybar-remain.warn{color:var(--al);} .daybar-remain.danger{color:var(--rl);}
.daybar-remain span{font-size:13px;color:var(--tx3);margin-left:4px;}
.daybar-track{height:12px;background:var(--bg3);border-radius:6px;overflow:hidden;position:relative;}
.daybar-fill{height:100%;border-radius:6px;transition:width 0.8s ease,background 0.8s ease;}
.daybar-labels{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--tx3);}
.daybar-times{display:flex;justify-content:space-between;margin-top:2px;font-family:var(--mono);font-size:12px;color:var(--tx2);}

/* ── Filters ── */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fpill{background:var(--sur);border:1px solid var(--bdr);border-radius:99px;padding:6px 13px;font-family:var(--mono);font-size:11px;color:var(--tx3);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.15s;}
.fpill.on{background:var(--bg3);border-color:var(--gb);color:var(--gg);}
.fpill.fav-pill.on{border-color:var(--al);color:var(--al);}

/* ── Stat row ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:11px 12px;}
.stat.viable-stat{cursor:pointer;border-color:var(--bdr2);position:relative;}
.stat.viable-stat:active{border-color:var(--gb);}
.stat-label{font-family:var(--mono);font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;}
.stat-value{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--tx);line-height:1;}
.stat-sub{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:3px;}
.viable-open{font-family:var(--mono);font-size:10px;color:var(--gb);margin-top:4px;}

/* ── Open-all drawer ── */
.openall-drawer{overflow:hidden;max-height:0;transition:max-height 0.3s ease;margin-bottom:0;}
.openall-drawer.open{max-height:120px;margin-bottom:14px;}
.openall-inner{background:var(--sur2);border:1px solid var(--bdr2);border-radius:12px;padding:13px 14px;}
.openall-desc{font-family:var(--mono);font-size:11px;color:var(--tx2);margin-bottom:10px;line-height:1.5;}
.openall-btn{width:100%;background:var(--green);border:1px solid var(--gl);border-radius:9px;padding:11px;color:var(--gg);font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.openall-btn:active{transform:scale(0.98);background:var(--gl);}
.openall-btn.disabled{background:var(--sur);border-color:var(--bdr);color:var(--tx3);cursor:not-allowed;}

/* ── Section head ── */
.section-head{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--tx3);margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.sdot-g{background:var(--gb);} .sdot-r{background:var(--rl);}

/* ── Course card ── */
.ccard{background:var(--sur);border:1px solid var(--bdr);border-radius:14px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;}
.ccard.dimmed{opacity:0.28;}
.ccard-left{flex:1;min-width:0;}
.ccard-name{font-size:14px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.ccard-meta{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-bottom:3px;}
.ccard-region{font-family:var(--mono);font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px;}
.ccard-times{font-family:var(--mono);font-size:11px;margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap;}
.t-leave{color:var(--al);} .t-arrive{color:var(--gb);}
.badges{display:flex;gap:4px;flex-wrap:wrap;}
.badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;font-weight:500;}
.b18{background:rgba(90,171,53,0.15);color:var(--gg);border:1px solid rgba(90,171,53,0.25);}
.b9{background:rgba(196,127,23,0.15);color:var(--al);border:1px solid rgba(196,127,23,0.25);}
.bpar3{background:rgba(126,212,79,0.1);color:#a8e06b;border:1px solid rgba(126,212,79,0.2);}
.btype{background:rgba(255,255,255,0.05);color:var(--tx3);border:1px solid var(--bdr);}
.bno{background:rgba(192,57,43,0.12);color:var(--rl);border:1px solid rgba(192,57,43,0.2);}
.bgn{background:rgba(55,138,221,0.12);color:#7ab8f5;border:1px solid rgba(55,138,221,0.2);}
.bnobk{background:rgba(90,171,53,0.08);color:var(--tx2);border:1px solid rgba(90,171,53,0.15);}
.ccard-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.visit-btn{background:var(--bg3);border:1px solid var(--bdr);border-radius:9px;padding:7px 10px;color:var(--tx2);font-family:var(--mono);font-size:11px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:4px;white-space:nowrap;}

<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div>
      <div class="app-title">SEQ <span>Golf</span> Finder</div>
      <div class="app-meta" id="updated-ts">tap refresh to load</div>
      <div class="app-meta" id="loc-status"></div>
    </div>
    <button class="refresh-btn" onclick="init()"><span id="refresh-icon">↻</span> Refresh</button>
  </div>

  <!-- HERO: Daylight bar -->
  <div class="daybar">
    <div class="daybar-top">
      <div class="daybar-title">Daylight remaining</div>
      <div class="daybar-remain pulse" id="db-remain">-- hrs</div>
    </div>
    <div class="daybar-track"><div class="daybar-fill" id="daybar-fill" style="width:50%;background:var(--gb);"></div></div>
    <div class="daybar-labels"><span>Sunrise</span><span>Now</span><span>Last light</span></div>
    <div class="daybar-times">
      <span id="db-sunrise">--:--</span>
      <span id="db-now">--:--</span>
      <span id="db-sunset">--:--</span>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <button class="fpill fav-pill" onclick="setFilter('favs',this)">⭐ Favs</button>
    <button class="fpill on" onclick="setFilter('all',this)">All</button>
    <button class="fpill" onclick="setFilter('playable',this)">Playable</button>
    <button class="fpill" onclick="setFilter('18',this)">18 holes</button>
    <button class="fpill" onclick="setFilter('9',this)">9 holes</button>

    <button class="fpill" onclick="setFilter('nobooking',this)">No booking</button>
    <button class="fpill" onclick="setFilter('brisbane',this)">Brisbane</button>
    <button class="fpill" onclick="setFilter('goldcoast',this)">Gold Coast</button>
    <button class="fpill" onclick="setFilter('sunshine',this)">Sunshine Coast</button>
    <button class="fpill" onclick="setFilter('toowoomba',this)">Toowoomba</button>
  </div>

  <!-- Stats row -->
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Playable now</div>
      <div class="stat-value pulse" id="s-playable">--</div>
      <div class="stat-sub" id="s-playable-sub">in filter</div>
    </div>
    <div class="stat">

</div>

// ── Constants ────────────────────────────────────────────────
const PREP   = 20;   // mins to get ready and leave house
const BUFFER = 15;   // mins buffer before tee time
const SUNRISE_DEFAULT = 5*60+30;
const REGION_LABELS = {brisbane:'Brisbane',goldcoast:'Gold Coast',sunshine:'Sunshine Coast',toowoomba:'Toowoomba / Scenic Rim'};

// ── State ────────────────────────────────────────────────────
let sunsetMins   = null;
let sunriseMins  = SUNRISE_DEFAULT;
let activeFilter = localStorage.getItem('gf_filter') || 'all';
let favourites   = JSON.parse(localStorage.getItem('gf_favs') || '[]');
let drawerOpen   = false;

// ── Time helpers ─────────────────────────────────────────────
function pad(n){ return String(n).padStart(2,'0'); }
function nowMins(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function minsToStr(m){
  const norm=((m%1440)+1440)%1440;
  const h=Math.floor(norm/60), mn=norm%60;
  return `${h%12||12}:${pad(mn)}${h>=12?'pm':'am'}`;
}

// ── Playability ───────────────────────────────────────────────
// Par-3: 9 holes ~60 min; Full: 9 holes ~150 min, 18 holes ~270 min
function roundMins(c, holeCount){
  if(c.par3) return 60;
  return holeCount === 18 ? 270 : 150;
}
function canPlayHoles(c, holeCount, daylight){
  if(!c.holes.includes(holeCount)) return false;
  return daylight >= c.drive + roundMins(c, holeCount) + BUFFER;
}
function canPlayAny(c, daylight){
  return c.holes.some(h => canPlayHoles(c, h, daylight));
}

// ── Location + sunset ────────────────────────────────────────
function getLocation(){
  return new Promise(resolve => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat:p.coords.latitude,lng:p.coords.longitude}),
      () => resolve(null),
      {timeout:8000,maximumAge:300000}
    );
  });
}

async function fetchSunset(lat,lng){
  const la=lat||-27.4698, lo=lng||153.0251;
  try{
    const r=await fetch(`https://api.sunrisesunset.io/json?lat=${la}&lng=${lo}&timezone=auto&date=today`);
    const d=await r.json();
    if(d.status==='OK'){
      const parse=str=>{
        const[time,ap]=str.split(' ');
        const[hh,mm]=time.split(':').map(Number);
        let h=hh;
        if(ap==='PM'&&hh!==12)h+=12;
        if(ap==='AM'&&hh===12)h=0;
        return h*60+mm;
      };
      return{sunset:parse(d.results.sunset),sunrise:parse(d.results.sunrise),live:true};
    }
  }catch(e){}
  const mo=new Date().getMonth();
  return{sunset:(mo>=4&&mo<=8)?17*60+10:18*60+25,sunrise:5*60+30,live:false};
}

// ── Filter ───────────────────────────────────────────────────
function setFilter(f,btn){
  activeFilter=f;
  localStorage.setItem('gf_filter',f);
  document.querySelectorAll('.fpill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  drawerOpen=false;
  document.getElementById('openall-drawer').classList.remove('open');
  render();
}

function getFiltered(daylight){
  return COURSES.filter(c=>{
    switch(activeFilter){
      case 'favs':      return favourites.includes(c.name);
      case 'playable':  return canPlayAny(c,daylight);
      case '18':        return canPlayHoles(c,18,daylight);
      case '9':         return canPlayHoles(c,9,daylight)||canPlayHoles(c,18,daylight);
      case 'par3':      return c.par3;
      case 'close':     return c.drive<=30;
      case 'visitor':   return c.type!=='private';
      case 'golfnow':   return c.golfnow;
      case 'nobooking': return c.noBooking;
      case 'brisbane':  return c.region==='brisbane';
      case 'goldcoast': return c.region==='goldcoast';
      case 'sunshine':  return c.region==='sunshine';
      case 'toowoomba': return c.region==='toowoomba';
      default:          return true;
    }
  });
}

// ── Drawer ───────────────────────────────────────────────────
function toggleDrawer(){
  drawerOpen=!drawerOpen;
  document.getElementById('openall-drawer').classList.toggle('open',drawerOpen);
}

function openAll(){
  if(sunsetMins===null)return;
  const daylight=Math.max(0,sunsetMins-nowMins());
  const toOpen=getFiltered(daylight).filter(c=>canPlayAny(c,daylight));
  if(!toOpen.length)return;
  toOpen.forEach((c,i)=>{setTimeout(()=>window.open(c.url,'_blank'),i*200);});
}

// ── Favourites ───────────────────────────────────────────────
function toggleFav(name,btn){
  const idx=favourites.indexOf(name);
  if(idx===-1){favourites.push(name);btn.classList.add('on');btn.textContent='⭐';}
  else{favourites.splice(idx,1);btn.classList.remove('on');btn.textContent='☆';}
  localStorage.setItem('gf_favs',JSON.stringify(favourites));
  if(activeFilter==='favs')render();
}

// ── Render ───────────────────────────────────────────────────
function render(){
  if(sunsetMins===null)return;
  const now=nowMins();
  const daylight=Math.max(0,sunsetMins-now);
  const dHrs=(daylight/60).toFixed(1);

  // Hero daylight bar
  const remEl=document.getElementById('db-remain');
  remEl.textContent=dHrs+' ';
  const span=document.createElement('span');span.textContent='hrs left';
  remEl.appendChild(span);
  remEl.className='daybar-remain'+(daylight<120?' danger':daylight<240?' warn':'');

  document.getElementById('db-now').textContent=minsToStr(now);
  document.getElementById('db-sunset').textContent=minsToStr(sunsetMins);
  document.getElementById('db-sunrise').textContent=minsToStr(sunriseMins);

  const totalDay=sunsetMins-sunriseMins;
  const pct=Math.min(100,Math.max(0,Math.round(((now-sunriseMins)/totalDay)*100)));
  const fill=document.getElementById('daybar-fill');
  fill.style.width=pct+'%';
  fill.style.background=pct>85?'var(--rl)':pct>65?'var(--al)':'var(--gb)';

  // Stats — all three respond to active filter
  const filtered=getFiltered(daylight);
  const playableInFilter=filtered.filter(c=>canPlayAny(c,daylight));
  const playableInFilterCount=playableInFilter.length;

  // Nearest viable course in current filter
  const nearest=playableInFilter.sort((a,b)=>a.drive-b.drive)[0]||null;
  const nearestDrive=nearest?nearest.drive:null;
  const leaveBy=nearest?minsToStr(now+PREP):null;

  document.getElementById('s-playable').textContent=playableInFilterCount;
  document.getElementById('s-playable-sub').textContent=
    playableInFilterCount===1?'course':activeFilter==='all'?'of '+COURSES.length+' total':'in filter';

  document.getElementById('s-leaveby').textContent=leaveBy||'--:--';
  document.getElementById('s-leaveby-sub').textContent=nearest?`for ${nearest.suburb}`:'no viable course';

  document.getElementById('s-nearest').textContent=nearestDrive?nearestDrive+' min':'--';
  document.getElementById('s-nearest-sub').textContent=nearest?nearest.name.split(' ').slice(0,2).join(' '):'';

  // Drawer content
  const openable=playableInFilter;
  const hint=document.getElementById('s-viable-hint');
  const desc=document.getElementById('openall-desc');
  const btn=document.getElementById('openall-btn');
  if(openable.length>0){
    hint.textContent='⛳ tap to open';
    desc.textContent=`Opens ${openable.length} course${openable.length!==1?'s':''} matching your current filter. Each booking page opens in a new tab.`;
    btn.classList.remove('disabled');
  }else{
    hint.textContent='⛳ tap to open';
    desc.textContent='No courses in your current filter have enough daylight remaining.';
    btn.classList.add('disabled');
  }

  // Restore active pill
  document.querySelectorAll('.fpill').forEach(b=>{
    const f=b.getAttribute('onclick').match(/setFilter\('([^']+)'/)?.[1];
    if(f)b.classList.toggle('on',f===activeFilter);
  });

  // Course list
  const display=activeFilter==='all'?[...COURSES].sort((a,b)=>a.drive-b.drive):filtered;
  const playable=display.filter(c=>canPlayAny(c,daylight));
  const notPlayable=activeFilter==='all'?display.filter(c=>!canPlayAny(c,daylight)):[];

  let html='';
  if(playable.length){
    html+=`<div class="section-head"><span class="sdot sdot-g"></span>Playable today &mdash; ${playable.length} course${playable.length!==1?'s':''}</div>`;
    playable.forEach(c=>{html+=courseCard(c,daylight,false);});
  }
  if(notPlayable.length){
    html+=`<div class="section-head" style="margin-top:20px;"><span class="sdot sdot-r"></span>Not enough daylight &mdash; ${notPlayable.length} course${notPlayable.length!==1?'s':''}</div>`;
    notPlayable.forEach(c=>{html+=courseCard(c,daylight,true);});
  }
  if(!playable.length&&!notPlayable.length)html='<div class="no-results">No courses match this filter.</div>';
  document.getElementById('course-list').innerHTML=html;
}

function courseCard(c,daylight,dimmed){
  const can9 =canPlayHoles(c,9,daylight);
  const can18=canPlayHoles(c,18,daylight);
  const isFav=favourites.includes(c.name);

  // Leave by = now + PREP; Arrive = now + PREP + drive
  const leaveBy =nowMins()+PREP;
  const arriveAt=nowMins()+PREP+c.drive;
  const timeLine=!dimmed
    ?`<div class="ccard-times"><span class="t-leave">leave ${minsToStr(leaveBy)}</span><span class="t-arrive">arrive ~${minsToStr(arriveAt)}</span></div>`
    :'';

  const roundTime=c.par3?'~1 hr/9':can18?'~4.5 hrs/18':'~2.5 hrs/9';

  const b18 =can18?'<span class="badge b18">18 holes</span>':'';
  const b9  =can9 ?'<span class="badge b9">9 holes</span>':'';
  const bP3 =c.par3?'<span class="badge bpar3">par 3</span>':'';
  const bType=`<span class="badge btype">${c.type}</span>`;
  const bGN =c.golfnow?'<span class="badge bgn">GolfNow</span>':'';
  const bNB =c.noBooking?'<span class="badge bnobk">walk-up</span>':'';
  const bNo =dimmed?'<span class="badge bno">no time today</span>':'';

  return `<div class="ccard${dimmed?' dimmed':''}">
    <div class="ccard-left">
      <div class="ccard-name">${c.name}</div>
      <div class="ccard-meta">${c.suburb} &middot; ${c.drive} min drive &middot; ${roundTime}</div>
      <div class="ccard-region">${REGION_LABELS[c.region]||c.region}</div>
      ${timeLine}
      <div class="badges">${b18}${b9}${bP3}${bNo}${bType}${bGN}${bNB}</div>
    </div>
    <div class="ccard-right">
      <a class="visit-btn" href="${c.url}" target="_blank">Visit &#8599;</a>
      <button class="fav-btn${isFav?' on':''}" onclick="toggleFav('${c.name}',this)">${isFav?'⭐':'☆'}</button>
    </div>
  </div>`;
}

// ── Init ─────────────────────────────────────────────────────
async function init(){
  const icon=document.getElementById('refresh-icon');
  icon.className='spin';
  document.querySelectorAll('.stat-value,.daybar-remain').forEach(el=>el.classList.add('pulse'));
  document.getElementById('loc-status').textContent='getting location...';
  document.getElementById('loc-status').className='app-meta loc-est';

  const loc=await getLocation();
  const lat=loc?.lat,lng=loc?.lng;
  if(loc){
    document.getElementById('loc-status').textContent=`GPS ${lat.toFixed(3)}, ${lng.toFixed(3)}`;
    document.getElementById('loc-status').className='app-meta loc-ok';
  }else{
    document.getElementById('loc-status').textContent='location unavailable — using Toowong';
    document.getElementById('loc-status').className='app-meta loc-est';
  }

  const result=await fetchSunset(lat,lng);
  sunsetMins=result.sunset;
  sunriseMins=result.sunrise||SUNRISE_DEFAULT;
  document.getElementById('loc-status').textContent += result.live?' · sunset live':' · sunset est.';
  document.getElementById('updated-ts').textContent='updated '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('.stat-value,.daybar-remain').forEach(el=>el.classList.remove('pulse'));
  icon.className='';
  render();
  clearInterval(window._iv);
  window._iv=setInterval(()=>{
    render();
    document.getElementById('updated-ts').textContent='updated '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
  },60000);
}

init();
</script>

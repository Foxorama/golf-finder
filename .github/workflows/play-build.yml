name: Build Play Course

# Runs the open-data Play build (scripts/play/gap-fill.mjs) on a runner and commits the
# built {play,geom} JSON back to the working branch.
#
# Exists for the same reason as play-osm-fetch.yml: the build's gap-fillers trace fairways
# and bunkers from Esri World Imagery, and a sandboxed dev environment's egress policy
# blocks that host outright. A runner has open internet, so the imagery-dependent half of
# the build happens here and the session bakes + QAs the result.
#
# The QA report the build writes to stderr is echoed into the job log — read it before
# baking (see the add-play-course skill, §3a per-hole QA review).

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Course slug — reads _osm/<slug>.osm.json + <slug>.config.json'
        required: true
      target:
        description: 'Branch to commit the built JSON to'
        required: true

permissions:
  contents: write

concurrency:
  group: play-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SLUG: ${{ inputs.slug }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build course (OSM + imagery gap-fill)
        working-directory: scripts/play
        run: node gap-fill.mjs "_osm/$SLUG.osm.json" "$SLUG.config.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-${{ inputs.slug }}
          path: scripts/play/_osm/*_built.json
          if-no-files-found: ignore

      - name: Commit built JSON to target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "scripts/play/_osm/${SLUG}.osm_built.json"
          if git diff --cached --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "CI: build Play course geometry for $SLUG"
          git push origin HEAD:"$TARGET"

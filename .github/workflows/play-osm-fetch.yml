name: Play course data (fetch OSM / build geometry)

# Sources the open data a Play course is built from, on a runner, and commits it back to
# the working branch. Two stages, either or both selectable via the `mode` input:
#   * fetch — Overpass `out geom` JSON for the course  -> scripts/play/_osm/<slug>.osm.json
#   * build — scripts/play/gap-fill.mjs (OSM + Esri World Imagery gap-fill)
#             -> scripts/play/_osm/<slug>.osm_built.json, ready for bake-play-course.mjs
#
# Exists because both halves need hosts a sandboxed dev environment's egress policy blocks:
# Overpass for the fetch, services.arcgisonline.com for the imagery tracing. A runner has
# open internet, so the work that can't happen locally happens here and the session bakes +
# QAs the result. A single-course Overpass query also dodges the bulk-prebake throttling
# that makes course-maps.yml flaky on CI IPs.
#
# The build's QA report goes to stderr and lands in the job log — read it before baking
# (see the add-play-course skill, §3a per-hole QA review).
#
# Two ways to run it:
#   * `workflow_dispatch` (preferred) — pass the course + target branch as inputs.
#     A session whose git pushes don't trigger workflows (the token doesn't fire
#     `push` events) can still start it via the Actions API.
#   * pushing the throwaway branch `ci/osm-fetch` — the fallback, using the env
#     defaults below.
# Either way it checks out the target branch, does the work, and commits there.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which stages to run'
        type: choice
        options: [ fetch, build, both, aerial ]
        default: fetch
      name:
        description: 'Course name regex for the Overpass name query (fetch)'
        required: false
      slug:
        description: 'Course slug — names the OSM/built files and the build config'
        required: true
      lat:
        description: 'Interior latitude for the is_in fallback query (fetch)'
        required: false
      lng:
        description: 'Interior longitude for the is_in fallback query (fetch)'
        required: false
      aerial_src:
        description: 'Extent for the aerial fetch — a play-geom/<slug>.json, an Overpass JSON, or "minLat,minLng,maxLat,maxLng" (aerial)'
        required: false
      aerial_mpp:
        description: 'Target metres-per-pixel for the aerial (aerial)'
        required: false
      aerial_source:
        description: 'Imagery source to try FIRST — qld or esri. Leave blank for the qld-then-esri default (aerial)'
        required: false
      target:
        description: 'Branch to commit the results to'
        required: true
  push:
    branches: [ 'ci/osm-fetch' ]

permissions:
  contents: write

concurrency:
  group: play-osm-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode || 'fetch' }}
      NAME: ${{ inputs.name || 'McLeod' }}
      SLUG: ${{ inputs.slug || 'mcleod-country-golf-club' }}
      LAT: ${{ inputs.lat || '-27.5505' }}
      LNG: ${{ inputs.lng || '152.924' }}
      TARGET: ${{ inputs.target || 'claude/mcleod-country-club-map-7x0nvp' }}
      AERIAL_SRC: ${{ inputs.aerial_src || '' }}
      AERIAL_MPP: ${{ inputs.aerial_mpp || '0.4' }}
      AERIAL_SOURCE: ${{ inputs.aerial_source || 'qld' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only the fetch stages source OSM. This used to be `mode != 'build'`, which meant an
      # `aerial` run also re-ran the fetch — and since an aerial dispatch has no reason to pass
      # name/lat/lng, those fell back to the workflow defaults and the previous course's OSM
      # overwrote this course's file, so the aerial came back over the wrong course entirely.
      - name: Fetch OSM geometry
        if: ${{ inputs.mode == 'fetch' || inputs.mode == 'both' }}
        run: node scripts/play/fetch-osm.mjs "$NAME" "scripts/play/_osm/$SLUG.osm.json" "$LAT" "$LNG"

      - name: Build course geometry (OSM + imagery gap-fill)
        if: ${{ inputs.mode == 'build' || inputs.mode == 'both' }}
        working-directory: scripts/play
        run: node gap-fill.mjs "_osm/$SLUG.osm.json" "$SLUG.config.json"

      - name: Fetch a georeferenced aerial of the course
        if: ${{ inputs.mode == 'aerial' }}
        run: |
          SRC="${AERIAL_SRC:-play-geom/$SLUG.json}"
          node scripts/play/fetch-aerial.mjs "$SRC" "scripts/play/_osm/$SLUG.aerial.png" "$AERIAL_MPP" "$AERIAL_SOURCE"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-${{ env.SLUG }}
          path: |
            scripts/play/_osm/*.json
            scripts/play/_osm/*.aerial.png
          if-no-files-found: ignore

      - name: Commit results to target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/play/_osm/
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "CI: play course data for $SLUG (mode=$MODE)"
          git push origin HEAD:"$TARGET"

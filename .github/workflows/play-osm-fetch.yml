name: Fetch Play OSM

# Sources a course's OpenStreetMap golf geometry from Overpass and commits the
# raw `out geom` JSON back to the working branch, where build-play-course.mjs +
# bake-play-course.mjs turn it into COURSE_PLAY/COURSE_GEOM.
#
# Exists because Overpass is unreachable from some sandboxed dev environments
# (egress policy) — a GitHub Actions runner has open internet, so the fetch that
# can't happen locally happens here. A single-course query also dodges the
# bulk-prebake throttling that makes course-maps.yml flaky on CI IPs.
#
# Two ways to run it:
#   * `workflow_dispatch` (preferred) — pass the course + target branch as inputs.
#     A session whose git pushes don't trigger workflows (the token doesn't fire
#     `push` events) can still start it via the Actions API.
#   * pushing the throwaway branch `ci/osm-fetch` — the fallback, using the env
#     defaults below.
# Either way it checks out the target branch, fetches, and commits the OSM JSON there.

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Course name regex for the Overpass name query'
        required: true
      slug:
        description: 'Course slug (output file name)'
        required: true
      lat:
        description: 'Interior latitude for the is_in fallback query'
        required: true
      lng:
        description: 'Interior longitude for the is_in fallback query'
        required: true
      target:
        description: 'Branch to commit the OSM JSON to'
        required: true
  push:
    branches: [ 'ci/osm-fetch' ]

permissions:
  contents: write

concurrency:
  group: play-osm-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      NAME: ${{ inputs.name || 'McLeod' }}
      SLUG: ${{ inputs.slug || 'mcleod-country-golf-club' }}
      LAT: ${{ inputs.lat || '-27.5505' }}
      LNG: ${{ inputs.lng || '152.924' }}
      TARGET: ${{ inputs.target || 'claude/mcleod-country-club-map-7x0nvp' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch OSM geometry
        run: node scripts/play/fetch-osm.mjs "$NAME" "scripts/play/_osm/$SLUG.osm.json" "$LAT" "$LNG"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-${{ env.SLUG }}
          path: scripts/play/_osm/*.json
          if-no-files-found: ignore

      - name: Commit OSM JSON to target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/play/_osm/
          if git diff --cached --quiet; then
            echo "No new OSM data to commit"
            exit 0
          fi
          git commit -m "CI: fetch OSM geometry for $SLUG"
          git push origin HEAD:"$TARGET"

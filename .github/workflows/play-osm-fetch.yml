name: Fetch Play OSM

# Sources a course's OpenStreetMap golf geometry from Overpass and commits the
# raw `out geom` JSON back to the working branch, where build-play-course.mjs +
# bake-play-course.mjs turn it into COURSE_PLAY/COURSE_GEOM.
#
# Exists because Overpass is unreachable from some sandboxed dev environments
# (egress policy) — a GitHub Actions runner has open internet, so the fetch that
# can't happen locally happens here. A single-course query also dodges the
# bulk-prebake throttling that makes course-maps.yml flaky on CI IPs.
#
# Manual-dispatch. Trigger on the working branch (the workflow reads inputs.branch
# and pushes the result there).

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Course name (Overpass name~ regex, case-insensitive)'
        default: 'Kingston Heath'
      slug:
        description: 'Course slug (output filename)'
        default: 'kingston-heath-golf-club'
      lat:
        description: 'Interior latitude (is_in fallback)'
        default: '-37.9542'
      lng:
        description: 'Interior longitude (is_in fallback)'
        default: '145.0686'
      branch:
        description: 'Branch to commit the OSM JSON to'
        default: 'claude/melb-course-osm-data-4na7mg'

permissions:
  contents: write

concurrency:
  group: play-osm-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch OSM geometry
        run: node scripts/play/fetch-osm.mjs "${{ inputs.name }}" "scripts/play/_osm/${{ inputs.slug }}.osm.json" "${{ inputs.lat }}" "${{ inputs.lng }}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-${{ inputs.slug }}
          path: scripts/play/_osm/*.json
          if-no-files-found: ignore

      - name: Commit OSM JSON to branch
        run: |
          if git diff --quiet -- scripts/play/_osm/; then
            echo "No new OSM data to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/play/_osm/
          git commit -m "CI: fetch OSM geometry for ${{ inputs.slug }}"
          git push origin HEAD:${{ inputs.branch }}

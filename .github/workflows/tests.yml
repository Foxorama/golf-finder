name: Tests

# Regression guard for the Play stats engine. Runs the zero-dependency Node harness in
# tests/ (pure stats-core math + a parse check of every inline <script> in index.html) on
# every push and PR. No build step, no deps — just Node.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Play stats tests
        run: node tests/run.mjs
